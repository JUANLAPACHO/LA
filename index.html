<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Calidad Cítrica - Calibrado</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .brand-bg { background-color: #6CA83B; }
        .brand-text { color: #6CA83B; }
        .brand-border { border-color: #6CA83B; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 font-sans">

    <!-- HEADER / BRANDING -->
    <header class="brand-bg text-white p-4 shadow-lg">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold tracking-wide">🍊 Control de Calidad Cítrica</h1>
            <span class="bg-white/20 px-3 py-1 rounded-full text-xs font-semibold">Few-Shot Calibrated</span>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4 space-y-6">

        <!-- PANEL DE CONFIGURACIÓN Y CAPTURA -->
        <section class="bg-white p-6 rounded-xl shadow-md space-y-4">
            <h2 class="text-xl font-semibold text-gray-700 border-b pb-2">1. Captura y Configuración</h2>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">OpenAI API Key</label>
                <input type="password" id="apiKeyInput" placeholder="sk-proj-..." class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none">
            </div>

            <!-- BOTÓN / CAPTURA DE FOTOGRAFÍAS -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Muestras de Fruta</label>
                <input type="file" id="cameraInput" accept="image/*" capture="environment" multiple class="hidden">
                <button id="captureBtn" onclick="document.getElementById('cameraInput').click()" class="w-full py-3 bg-gray-800 text-white font-medium rounded-lg hover:bg-gray-700 transition flex items-center justify-center gap-2">
                    📷 Tomar / Subir Fotografías de Muestra
                </button>
            </div>

            <!-- CONTENEDOR DE PREVISUALIZACIÓN -->
            <div id="previewContainer" class="grid grid-cols-3 gap-2 pt-2"></div>

            <!-- ACCIÓN DE IA -->
            <button id="analyzeIaBtn" disabled class="w-full py-3 brand-bg text-white font-bold rounded-lg opacity-50 cursor-not-allowed hover:opacity-90 transition">
                🤖 Analizar Calidad con IA
            </button>
        </section>

        <!-- PANEL DE RESULTADOS DE IA -->
        <section id="iaResultsPanel" class="bg-white p-6 rounded-xl shadow-md space-y-4 hidden">
            <div class="flex justify-between items-center border-b pb-2">
                <h2 class="text-xl font-semibold text-gray-700">2. Métrica de Calibración e Inspección</h2>
                <span id="iaConfianzaBadge" class="px-2 py-1 bg-green-100 text-green-800 text-xs font-bold rounded">ALTA</span>
            </div>

            <p id="iaConfianzaMensaje" class="text-xs text-gray-500 italic"></p>

            <!-- METRICAS DE CONTEO Y CLASIFICACIÓN -->
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
                <div class="bg-gray-50 p-3 rounded-lg border text-center">
                    <span class="text-xs text-gray-500 block">Total Unidades</span>
                    <span id="iaVisibles" class="text-xl font-bold text-gray-800">0 uds</span>
                </div>
                <div class="bg-green-50 p-3 rounded-lg border border-green-200 text-center">
                    <span class="text-xs text-green-600 block">Fruta Limpia</span>
                    <span id="iaLimpia" class="text-xl font-bold text-green-700">0%</span>
                </div>
                <div class="bg-yellow-50 p-3 rounded-lg border border-yellow-200 text-center">
                    <span class="text-xs text-yellow-600 block">Defectos Leves</span>
                    <span id="iaLeves" class="text-xl font-bold text-yellow-700">0%</span>
                </div>
                <div class="bg-red-50 p-3 rounded-lg border border-red-200 text-center">
                    <span class="text-xs text-red-600 block">Defectos Mayores</span>
                    <span id="iaMayores" class="text-xl font-bold text-red-700">0%</span>
                </div>
            </div>

            <!-- DESGLOSE DE DEFECTOS Y SCORE -->
            <div class="grid grid-cols-2 gap-4 pt-2">
                <div class="space-y-1 text-sm">
                    <p><strong>Manchas:</strong> <span id="iaManchas">0%</span></p>
                    <p><strong>Cicatrices:</strong> <span id="iaCicatrices">0%</span></p>
                    <p><strong>Oleocelosis:</strong> <span id="iaOleocelosis">0%</span></p>
                    <p><strong>Daño Mecánico:</strong> <span id="iaDano">0%</span></p>
                </div>
                <div class="bg-gray-50 p-3 rounded-lg border flex flex-col items-center justify-center">
                    <span class="text-xs text-gray-500">Puntaje Global</span>
                    <span id="iaPuntaje" class="text-3xl font-black brand-text">0/10</span>
                    <span id="iaClasif" class="text-xs font-bold uppercase text-gray-600 mt-1">-</span>
                </div>
            </div>

            <button id="submitBtn" disabled class="w-full py-3 bg-blue-600 text-white font-bold rounded-lg hover:bg-blue-700 transition">
                💾 Guardar e Inscribir Inspección
            </button>
        </section>

    </main>

    <!-- LÓGICA JAVASCRIPT INTEGRADA -->
    <script>
        // PATRONES DE CALIBRACIÓN OBTENIDOS DE GITHUB
        const PATRONES_URL = {
            limpia: "https://github.com/JUANLAPACHO/LA/blob/main/patrones/limpia.jpeg?raw=true",
            leve: "https://github.com/JUANLAPACHO/LA/blob/main/patrones/leve.jpeg?raw=true",
            leve1: "https://github.com/JUANLAPACHO/LA/blob/main/patrones/leve1.jpeg?raw=true",
            mayor: "https://github.com/JUANLAPACHO/LA/blob/main/patrones/mayor.jpeg?raw=true"
        };

        let sampleImages = [];
        let lastIaAnalysis = null;

        const cameraInput = document.getElementById('cameraInput');
        const previewContainer = document.getElementById('previewContainer');
        const analyzeIaBtn = document.getElementById('analyzeIaBtn');
        const apiKeyInput = document.getElementById('apiKeyInput');
        const iaResultsPanel = document.getElementById('iaResultsPanel');
        const submitBtn = document.getElementById('submitBtn');

        // MANTENER Y MOSTRAR FOTOGRAFÍAS CARGADAS
        cameraInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    sampleImages.push(event.target.result);
                    renderPreviews();
                    actualizarBotonAnalizar();
                };
                reader.readAsDataURL(file);
            });
        });

        function renderPreviews() {
            previewContainer.innerHTML = '';
            sampleImages.forEach((imgSrc, index) => {
                const div = document.createElement('div');
                div.className = 'relative border rounded-lg overflow-hidden h-24 bg-gray-200';
                div.innerHTML = `
                    <img src="${imgSrc}" class="w-full h-full object-cover">
                    <button onclick="removeImage(${index})" class="absolute top-1 right-1 bg-red-600 text-white rounded-full w-5 h-5 text-xs flex items-center justify-center font-bold">✕</button>
                `;
                previewContainer.appendChild(div);
            });
        }

        function removeImage(index) {
            sampleImages.splice(index, 1);
            renderPreviews();
            actualizarBotonAnalizar();
        }

        function actualizarBotonAnalizar() {
            if (sampleImages.length > 0) {
                analyzeIaBtn.disabled = false;
                analyzeIaBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            } else {
                analyzeIaBtn.disabled = true;
                analyzeIaBtn.classList.add('opacity-50', 'cursor-not-allowed');
            }
        }

        function calcularPuntajeYClasificacion(pctLimpia) {
            let puntaje = Math.round((pctLimpia / 100) * 10);
            let clasificacion = "Descarte / Proceso";

            if (pctLimpia >= 85) {
                clasificacion = "Exportación Premium";
            } else if (pctLimpia >= 70) {
                clasificacion = "Mercado Nacional";
            } else if (pctLimpia >= 50) {
                clasificacion = "Estándar / Industria";
            }

            return { puntaje, clasificacion };
        }

        // ANÁLISIS DE IA CON FEW-SHOT PROMPTING
        analyzeIaBtn.addEventListener('click', async () => {
            const apiKey = apiKeyInput.value.trim();
            if (!apiKey) {
                alert("⚠️ Por favor introduce tu API Key de OpenAI.");
                apiKeyInput.focus();
                return;
            }

            analyzeIaBtn.disabled = true;
            analyzeIaBtn.innerText = "⏳ Calibrando y analizando muestra...";

            // 1. INYECCIÓN DE PATRONES
            const fotosSemilla = [
                {
                    role: "user",
                    content: [
                        { type: "text", text: "PATRÓN DE CALIBRACIÓN 1 - FRUTA LIMPIA: Cítrico impecable de calidad exportación, sin manchas o marcas insignificantes." },
                        { type: "image_url", image_url: { url: PATRONES_URL.limpia } }
                    ]
                },
                {
                    role: "user",
                    content: [
                        { type: "text", text: "PATRÓN DE CALIBRACIÓN 2 - DEFECTO LEVE: Rozadura, cicatriz de viento o marca pequeña que afecta MENOS del 5% de la superficie." },
                        { type: "image_url", image_url: { url: PATRONES_URL.leve } }
                    ]
                },
                {
                    role: "user",
                    content: [
                        { type: "text", text: "PATRÓN DE CALIBRACIÓN 3 - DEFECTO LEVE (EJEMPLO 2): Muestra de defecto menor/superficial en zona delimitada." },
                        { type: "image_url", image_url: { url: PATRONES_URL.leve1 } }
                    ]
                },
                {
                    role: "user",
                    content: [
                        { type: "text", text: "PATRÓN DE CALIBRACIÓN 4 - DEFECTO MAYOR: Mancha grave, oleocelosis, daño mecánico o cicatriz que afecta MÁS del 5% de la fruta." },
                        { type: "image_url", image_url: { url: PATRONES_URL.mayor } }
                    ]
                }
            ];

            // 2. MUESTRA CAPTURADA
            const imageBlocks = sampleImages.map(base64 => ({
                type: "image_url",
                image_url: { url: base64 }
            }));

            // 3. PROMPT DE CONTEO
            const promptText = `Actúa como un inspector senior de calidad cítrica. Utilizando como ESTÁNDAR OBLIGATORIO DE COMPARACIÓN las 4 imágenes patrón recibidas anteriormente:

Realiza un CONTEO UNIDAD POR UNIDAD de todas las frutas visibles en la muestra:
1. Cuenta la cantidad total de frutas.
2. Clasifica cada unidad en una de estas categorías según los patrones:
   - Frutas Limpias
   - Frutas con Defectos Leves
   - Frutas con Defectos Mayores
3. Identifica la causa del defecto (manchas, cicatrices, oleocelosis, daño mecánico).

Devuelve EXCLUSIVAMENTE un JSON válido con esta estructura exacta de cantidades enteras:
{
    "frutas_visibles": 0,
    "cantidad_limpias": 0,
    "cantidad_leves": 0,
    "cantidad_mayores": 0,
    "detalle_defectos": {
        "manchas_count": 0,
        "cicatrices_count": 0,
        "oleocelosis_count": 0,
        "dano_mecanico_count": 0
    },
    "confianza_analisis": "ALTA",
    "motivo_confianza": "explicación sobre la claridad de la foto"
}`;

            const payloadMessages = [
                ...fotosSemilla,
                {
                    role: "user",
                    content: [{ type: "text", text: promptText }, ...imageBlocks]
                }
            ];

            try {
                const response = await fetch("https://api.openai.com/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: "gpt-4o-mini",
                        messages: payloadMessages,
                        max_tokens: 1000
                    })
                });

                const data = await response.json();
                if (data.error) throw new Error(data.error.message);

                let iaRaw = JSON.parse(data.choices[0].message.content.replace(/```json|```/g, '').trim());

                // 4. CÁLCULO MATEMÁTICO REAL EN CÓDIGO
                const total = iaRaw.frutas_visibles > 0 ? iaRaw.frutas_visibles : 1;
                
                const pctLimpia = Math.round(((iaRaw.cantidad_limpias || 0) / total) * 100);
                const pctLeves = Math.round(((iaRaw.cantidad_leves || 0) / total) * 100);
                const pctMayores = Math.round(((iaRaw.cantidad_mayores || 0) / total) * 100);

                const pctManchas = Math.round(((iaRaw.detalle_defectos?.manchas_count || 0) / total) * 100);
                const pctCicatrices = Math.round(((iaRaw.detalle_defectos?.cicatrices_count || 0) / total) * 100);
                const pctOleocelosis = Math.round(((iaRaw.detalle_defectos?.oleocelosis_count || 0) / total) * 100);
                const pctDano = Math.round(((iaRaw.detalle_defectos?.dano_mecanico_count || 0) / total) * 100);

                const { puntaje, clasificacion } = calcularPuntajeYClasificacion(pctLimpia);

                // RENDERIZAR EN DASHBOARD
                document.getElementById('iaVisibles').innerText = `${total} uds`;
                document.getElementById('iaLimpia').innerText = `${pctLimpia}%`;
                document.getElementById('iaLeves').innerText = `${pctLeves}%`;
                document.getElementById('iaMayores').innerText = `${pctMayores}%`;
                document.getElementById('iaManchas').innerText = `${pctManchas}%`;
                document.getElementById('iaCicatrices').innerText = `${pctCicatrices}%`;
                document.getElementById('iaOleocelosis').innerText = `${pctOleocelosis}%`;
                document.getElementById('iaDano').innerText = `${pctDano}%`;
                document.getElementById('iaPuntaje').innerText = `${puntaje}/10`;
                document.getElementById('iaClasif').innerText = String(clasificacion).toUpperCase();

                document.getElementById('iaConfianzaBadge').innerText = iaRaw.confianza_analisis || 'ALTA';
                document.getElementById('iaConfianzaMensaje').innerText = iaRaw.motivo_confianza || '';

                iaResultsPanel.classList.remove('hidden');
                submitBtn.disabled = false;

            } catch (err) {
                alert("❌ Error durante el análisis: " + err.message);
            } finally {
                analyzeIaBtn.innerText = "🤖 Analizar Calidad con IA";
                actualizarBotonAnalizar();
            }
        });
    </script>
</body>
</html>
